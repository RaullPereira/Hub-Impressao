name: CI - Build & Publish

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build-mac:
    name: Build macOS (dmg)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install system deps (macOS)
        run: |
          brew update || true
          brew install libusb || true

      - name: Install dependencies
        run: npm ci

      - name: Build mac (electron-builder)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -o pipefail
          npx electron-builder --mac --publish=never 2>&1 | tee build-mac.log

      - name: Upload mac build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-mac-log
          path: build-mac.log

  build-win:
    name: Build Windows (nsis)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install system deps (Windows)
        shell: powershell
        run: |
          choco install libusb -y || Write-Host 'choco install failed or already installed'

      - name: Install dependencies
        run: npm ci

      - name: Build win (electron-builder)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -o pipefail
          npx electron-builder --win --publish=never 2>&1 | tee build-win.log

      - name: Upload win build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-win-log
          path: build-win.log

  # Optional: Linux build (AppImage)
  build-linux:
    name: Build Linux (AppImage)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install system deps (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libusb-1.0-0-dev build-essential libudev-dev pkg-config

      - name: Install dependencies
        run: npm ci

      - name: Build linux (electron-builder)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -o pipefail
          npx electron-builder --linux --publish=never 2>&1 | tee build-linux.log

      - name: Upload linux build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-linux-log
          path: build-linux.log

  publish-npm:
    name: Publish npm package to GitHub Packages
    runs-on: ubuntu-latest
    needs: build-linux
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@raullpereira'

      - name: Install dependencies
        run: |
          npm ci

      - name: Configure npm auth
        run: |
          # Use the GitHub Actions token to authenticate to GitHub Packages
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> ~/.npmrc

      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm publish --registry=https://npm.pkg.github.com
